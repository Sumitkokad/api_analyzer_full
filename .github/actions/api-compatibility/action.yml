name: API Compatibility Analyzer
description: Compare base and pull-request OpenAPI contracts and enforce the CI gate.

inputs:
  api-base-url:
    description: Base URL of the API Analyzer backend.
    required: true

  project-id:
    description: API Analyzer project ID.
    required: true

  token:
    description: Project-scoped API Analyzer token.
    required: true

  spec-path:
    description: Path to the OpenAPI JSON or YAML specification.
    required: true

  generate-command:
    description: Command used to generate the OpenAPI specification. Leave empty when the contract is committed or otherwise already present.
    required: false
    default: ""

  contract-source:
    description: "Contract acquisition mode: auto, committed_file, or generated."
    required: false
    default: auto

  language:
    description: Repository language/runtime supplied by the adapter (for example Python, Node.js, Java, or C#).
    required: false
    default: ""

  package-manager:
    description: Repository package manager supplied by the adapter (for example pip, npm, pnpm, yarn, maven, gradle, or dotnet).
    required: false
    default: ""

  dependency-files:
    description: Newline-delimited dependency/manifest files supplied by the adapter.
    required: false
    default: ""

  working-directory:
    description: Repository-relative working directory used for dependency installation and contract generation.
    required: false
    default: ""

  install-command:
    description: Framework-neutral dependency installation command supplied by the adapter.
    required: false
    default: ""

  environment:
    description: Optional newline-delimited KEY=VALUE environment entries required by contract generation.
    required: false
    default: ""

  adapter-name:
    description: Adapter identifier recorded in the CI submission payload.
    required: false
    default: customer-action

  adapter-version:
    description: Adapter version recorded in the CI submission payload.
    required: false
    default: "1"

  generator-warnings:
    description: Optional newline-delimited warnings produced while acquiring the contract.
    required: false
    default: ""

  baseline-mode:
    description: "Baseline selection mode: merge-base or base."
    required: false
    default: merge-base

  fail-on-error:
    description: Fail the workflow when the analyzer returns ERROR or times out.
    required: false
    default: "true"

  poll-timeout-seconds:
    description: Maximum time to wait for analysis.
    required: false
    default: "600"

  poll-interval-seconds:
    description: Seconds between status requests.
    required: false
    default: "5"

outputs:
  comparison-id:
    description: Created comparison ID.
    value: ${{ steps.submit.outputs.comparison-id }}

  job-id:
    description: Created analysis job ID.
    value: ${{ steps.submit.outputs.job-id }}

  gate-status:
    description: Final CI gate status.
    value: ${{ steps.poll.outputs.gate-status || steps.submit.outputs.gate-status }}

  reason-code:
    description: Final reason code.
    value: ${{ steps.poll.outputs.reason-code || steps.submit.outputs.reason-code }}

  report-url:
    description: URL of the detailed comparison report.
    value: ${{ steps.poll.outputs.report-url || steps.submit.outputs.report-url }}

runs:
  using: composite

  steps:

    # ============================================================
    # 0. Detect the one-time API Analyzer setup pull request.
    #
    # The setup PR adds the generator/configuration that the compatibility
    # check itself needs. Running the analyzer on that PR would compare the
    # repository before its generator dependencies exist.
    # ============================================================

    - name: Determine execution mode
      id: mode
      shell: bash
      run: |
        set -euo pipefail

        HEAD_REF="${GITHUB_HEAD_REF:-}"

        if [[ "$HEAD_REF" == api-analyzer/setup/* ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "API Analyzer setup PR detected: $HEAD_REF"
          echo "Compatibility analysis is intentionally skipped for this one-time setup PR."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Normal compatibility analysis requested."
        fi


    # ============================================================
    # 1. Validate GitHub PR context
    # ============================================================

    - name: Validate GitHub PR context
      if: ${{ steps.mode.outputs.skip != 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
          echo "::error::API Compatibility Analyzer currently requires a pull_request event."
          exit 1
        fi


    # ============================================================
    # 2. Prepare CI variables
    # ============================================================

    - name: Prepare CI variables
      if: ${{ steps.mode.outputs.skip != 'true' }}
      id: prepare
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.project-id }}
        API_BASE_URL: ${{ inputs.api-base-url }}
        SPEC_PATH: ${{ inputs.spec-path }}
        GENERATE_COMMAND_INPUT: ${{ inputs.generate-command }}
        CONTRACT_SOURCE_INPUT: ${{ inputs.contract-source }}
        LANGUAGE: ${{ inputs.language }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        DEPENDENCY_FILES_INPUT: ${{ inputs.dependency-files }}
        WORKING_DIRECTORY_INPUT: ${{ inputs.working-directory }}
        INSTALL_COMMAND: ${{ inputs.install-command }}
        ADAPTER_NAME: ${{ inputs.adapter-name }}
        ADAPTER_VERSION: ${{ inputs.adapter-version }}
        GENERATOR_WARNINGS_INPUT: ${{ inputs.generator-warnings }}
        ENVIRONMENT_INPUT: ${{ inputs.environment }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        TIMEOUT_SECONDS: ${{ inputs.poll-timeout-seconds }}
        POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
      run: |
        set -euo pipefail

        PR_NUMBER="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
        REPOSITORY="$(jq -r '.repository.full_name // empty' "$GITHUB_EVENT_PATH")"
        BASE_SHA="$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")"
        HEAD_SHA="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")"

        if [[ -z "$PR_NUMBER" ]]; then
          echo "::error::Unable to determine pull request number."
          exit 1
        fi

        if [[ -z "$REPOSITORY" ]]; then
          echo "::error::Unable to determine repository."
          exit 1
        fi

        if [[ -z "$BASE_SHA" ]]; then
          echo "::error::Unable to determine base SHA."
          exit 1
        fi

        if [[ -z "$HEAD_SHA" ]]; then
          echo "::error::Unable to determine head SHA."
          exit 1
        fi

        if [[ -z "$PROJECT_ID" ]]; then
          echo "::error::API Analyzer project ID is empty."
          exit 1
        fi

        if [[ -z "$API_BASE_URL" ]]; then
          echo "::error::API Analyzer base URL is empty."
          exit 1
        fi

        if [[ -z "$SPEC_PATH" ]]; then
          echo "::error::OpenAPI specification path is empty."
          exit 1
        fi

        if [[ "$SPEC_PATH" = /* || "$SPEC_PATH" == *".."* ]]; then
          echo "::error::spec-path must be a repository-relative path without '..'."
          exit 1
        fi

        case "${CONTRACT_SOURCE_INPUT,,}" in
          auto|"")
            if [[ -n "$GENERATE_COMMAND_INPUT" ]]; then
              CONTRACT_SOURCE="generated"
            else
              CONTRACT_SOURCE="committed_file"
            fi
            ;;
          committed|committed_file)
            CONTRACT_SOURCE="committed_file"
            ;;
          generated)
            CONTRACT_SOURCE="generated"
            ;;
          *)
            echo "::error::contract-source must be auto, committed_file, or generated."
            exit 1
            ;;
        esac

        WORKING_DIRECTORY="$WORKING_DIRECTORY_INPUT"
        if [[ -z "$WORKING_DIRECTORY" ]]; then
          WORKING_DIRECTORY="."
        fi

        if [[ "$WORKING_DIRECTORY" = /* || "$WORKING_DIRECTORY" == *".."* ]]; then
          echo "::error::working-directory must be a repository-relative path without '..'."
          exit 1
        fi

        if [[ "$CONTRACT_SOURCE" == "generated" && -z "$GENERATE_COMMAND_INPUT" ]]; then
          echo "::error::contract-source=generated requires a non-empty generate-command."
          exit 1
        fi

        if [[ "$CONTRACT_SOURCE" == "committed_file" && -n "$GENERATE_COMMAND_INPUT" ]]; then
          echo "::error::contract-source=committed_file cannot be combined with generate-command."
          exit 1
        fi

        write_env_value() {
          local key="$1"
          local value="$2"
          local delimiter="API_ANALYZER_${key}_EOF"

          {
            printf '%s<<%s\n' "$key" "$delimiter"
            printf '%s\n' "$value"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"
        }

        write_env_value "GENERATE_COMMAND" "$GENERATE_COMMAND_INPUT"
        write_env_value "INSTALL_COMMAND" "$INSTALL_COMMAND"
        write_env_value "DEPENDENCY_FILES" "$DEPENDENCY_FILES_INPUT"
        write_env_value "GENERATOR_WARNINGS" "$GENERATOR_WARNINGS_INPUT"

        while IFS= read -r env_line; do
          [[ -z "$env_line" ]] && continue
          env_key="${env_line%%=*}"
          env_value="${env_line#*=}"
          if [[ ! "$env_key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::Invalid adapter environment variable name: $env_key"
            exit 1
          fi
          if [[ "$env_value" == *$'\n'* || "$env_value" == *$'\r'* ]]; then
            echo "::error::Adapter environment values must be single-line KEY=VALUE entries."
            exit 1
          fi
          echo "$env_key=$env_value" >> "$GITHUB_ENV"
        done <<< "$ENVIRONMENT_INPUT"

        echo "CONTRACT_SOURCE=$CONTRACT_SOURCE" >> "$GITHUB_ENV"
        echo "LANGUAGE=$LANGUAGE" >> "$GITHUB_ENV"
        echo "PACKAGE_MANAGER=$PACKAGE_MANAGER" >> "$GITHUB_ENV"
        echo "WORKING_DIRECTORY=$WORKING_DIRECTORY" >> "$GITHUB_ENV"
        echo "ADAPTER_NAME=$ADAPTER_NAME" >> "$GITHUB_ENV"
        echo "ADAPTER_VERSION=$ADAPTER_VERSION" >> "$GITHUB_ENV"

        if [[ ! "$TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::poll-timeout-seconds must be a positive integer."
          exit 1
        fi

        if [[ ! "$POLL_INTERVAL" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::poll-interval-seconds must be a positive integer."
          exit 1
        fi

        case "${FAIL_ON_ERROR,,}" in
          true|false)
            ;;
          *)
            echo "::error::fail-on-error must be true or false."
            exit 1
            ;;
        esac

        echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
        echo "REPOSITORY=$REPOSITORY" >> "$GITHUB_ENV"
        echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
        echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

        echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
        echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"
        echo "SPEC_PATH=$SPEC_PATH" >> "$GITHUB_ENV"
        echo "FAIL_ON_ERROR=$FAIL_ON_ERROR" >> "$GITHUB_ENV"
        echo "TIMEOUT_SECONDS=$TIMEOUT_SECONDS" >> "$GITHUB_ENV"
        echo "POLL_INTERVAL=$POLL_INTERVAL" >> "$GITHUB_ENV"

        echo "project-id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
        echo "api-base-url=$API_BASE_URL" >> "$GITHUB_OUTPUT"
        echo "spec-path=$SPEC_PATH" >> "$GITHUB_OUTPUT"

        echo "Repository: $REPOSITORY"
        echo "Pull request: #$PR_NUMBER"
        echo "Base SHA: $BASE_SHA"
        echo "Head SHA: $HEAD_SHA"


    # ============================================================
    # 3. Protect fork pull requests
    # ============================================================

    - name: Protect fork pull requests
      if: ${{ steps.mode.outputs.skip != 'true' }}
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        IS_FORK="$(jq -r '.pull_request.head.repo.fork // false' "$GITHUB_EVENT_PATH")"

        if [[ "$IS_FORK" == "true" && -z "$TOKEN" ]]; then
          echo "::error::API Analyzer project token is unavailable for this fork pull request."
          echo "::error::The compatibility check cannot securely submit the contract without project authentication."
          exit 1
        fi

        echo "Fork status: $IS_FORK"


    # ============================================================
    # 4. Fetch base and head commits
    # ============================================================

    - name: Fetch base and head commits
      if: ${{ steps.mode.outputs.skip != 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        # The base SHA belongs to the base repository. The head SHA may belong
        # to a fork, so fetching it directly from origin is not reliable.
        git fetch --no-tags origin "$BASE_SHA"

        PR_HEAD_REF="refs/remotes/origin/api-analyzer-pr-${PR_NUMBER}"
        git fetch \
          --no-tags \
          origin \
          "refs/pull/${PR_NUMBER}/head:${PR_HEAD_REF}"

        FETCHED_HEAD_SHA="$(git rev-parse "$PR_HEAD_REF")"
        if [[ "$FETCHED_HEAD_SHA" != "$HEAD_SHA" ]]; then
          echo "::error::GitHub pull-request head ref does not match the event head SHA."
          echo "::error::Event head SHA: $HEAD_SHA"
          echo "::error::Fetched PR head SHA: $FETCHED_HEAD_SHA"
          exit 1
        fi


    # ============================================================
    # 5. Select baseline
    # ============================================================

    - name: Select baseline
      if: ${{ steps.mode.outputs.skip != 'true' }}
      id: baseline
      shell: bash
      env:
        BASELINE_MODE: ${{ inputs.baseline-mode }}
      run: |
        set -euo pipefail

        case "$BASELINE_MODE" in
          merge-base)
            COMPARE_BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            ;;

          base)
            COMPARE_BASE_SHA="$BASE_SHA"
            ;;

          *)
            echo "::error::Unsupported baseline-mode: $BASELINE_MODE"
            echo "::error::Supported values: merge-base, base"
            exit 1
            ;;
        esac

        if [[ -z "$COMPARE_BASE_SHA" ]]; then
          echo "::error::Unable to determine comparison baseline."
          exit 1
        fi

        echo "COMPARE_BASE_SHA=$COMPARE_BASE_SHA" >> "$GITHUB_ENV"
        echo "compare-base-sha=$COMPARE_BASE_SHA" >> "$GITHUB_OUTPUT"

        echo "Comparison baseline: $COMPARE_BASE_SHA"


    # ============================================================
    # 6. Create isolated worktrees
    # ============================================================

    - name: Create temporary worktrees
      if: ${{ steps.mode.outputs.skip != 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        BASE_DIR="$RUNNER_TEMP/api-analyzer-base"
        HEAD_DIR="$RUNNER_TEMP/api-analyzer-head"

        rm -rf "$BASE_DIR" "$HEAD_DIR"

        git worktree add --detach "$BASE_DIR" "$COMPARE_BASE_SHA"
        git worktree add --detach "$HEAD_DIR" "$HEAD_SHA"

        echo "BASE_DIR=$BASE_DIR" >> "$GITHUB_ENV"
        echo "HEAD_DIR=$HEAD_DIR" >> "$GITHUB_ENV"


    # ============================================================
    # 7. Prepare isolated repository runtimes
    #
    # Each composite-action step runs in its own shell process. Runtime
    # directories/variables are persisted through GITHUB_ENV; helper functions
    # are therefore defined again in any later step that needs them.
    # ============================================================

    - name: Prepare repository runtime dependencies
      if: ${{ steps.mode.outputs.skip != 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        normalize_plan_path() {
          local value="$1"
          if [[ -z "$value" || "$value" == "." ]]; then
            printf '%s' "."
            return
          fi

          if [[ "$value" = /* || "$value" == *".."* ]]; then
            echo "::error::Invalid adapter working directory: $value"
            exit 1
          fi

          printf '%s' "${value#./}"
        }

        run_in_working_directory() {
          local repo_dir="$1"
          local command="$2"
          local workdir="$WORKING_DIRECTORY"

          if [[ -z "$command" ]]; then
            return 0
          fi

          if [[ "$workdir" == "." ]]; then
            (cd "$repo_dir" && eval "$command")
          else
            (cd "$repo_dir/$workdir" && eval "$command")
          fi
        }

        install_python_dependencies() {
          local repo_dir="$1"
          local label="$2"
          local workdir="$3"
          local venv_dir="$repo_dir/.api-analyzer-venv"
          local requirements_file=""

          echo "Preparing Python runtime for $label"
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --upgrade pip setuptools wheel

          while IFS= read -r raw_file; do
            local dependency_file="${raw_file//\\///}"
            dependency_file="${dependency_file#./}"
            [[ -z "$dependency_file" ]] && continue
            if [[ -f "$repo_dir/$dependency_file" ]]; then
              case "$(basename "$dependency_file")" in
                requirements*.txt)
                  requirements_file="$dependency_file"
                  break
                  ;;
                pyproject.toml|setup.py|setup.cfg)
                  requirements_file="$dependency_file"
                  break
                  ;;
              esac
            fi
          done <<< "${DEPENDENCY_FILES:-}"

          if [[ -z "$requirements_file" ]]; then
            local python_project_dir="$repo_dir"
            if [[ "$workdir" != "." ]]; then
              python_project_dir="$repo_dir/$workdir"
            fi

            if [[ -f "$python_project_dir/requirements.txt" ]]; then
              requirements_file="${workdir:+$workdir/}requirements.txt"
              requirements_file="${requirements_file#./}"
            elif [[ -f "$python_project_dir/requirements-dev.txt" ]]; then
              requirements_file="${workdir:+$workdir/}requirements-dev.txt"
              requirements_file="${requirements_file#./}"
            elif [[ -f "$python_project_dir/pyproject.toml" || -f "$python_project_dir/setup.py" || -f "$python_project_dir/setup.cfg" ]]; then
              requirements_file="${workdir:+$workdir/}pyproject.toml"
              requirements_file="${requirements_file#./}"
            elif [[ -f "$repo_dir/requirements.txt" ]]; then
              requirements_file="requirements.txt"
            elif [[ -f "$repo_dir/requirements-dev.txt" ]]; then
              requirements_file="requirements-dev.txt"
            elif [[ -f "$repo_dir/pyproject.toml" || -f "$repo_dir/setup.py" || -f "$repo_dir/setup.cfg" ]]; then
              requirements_file="pyproject.toml"
            fi
          fi

          if [[ -n "$INSTALL_COMMAND" ]]; then
            source "$venv_dir/bin/activate"
            run_in_working_directory "$repo_dir" "$INSTALL_COMMAND"
          elif [[ -n "$requirements_file" ]]; then
            if [[ "$requirements_file" == requirements*.txt ]]; then
              "$venv_dir/bin/python" -m pip install -r "$repo_dir/$requirements_file"
            else
              local dependency_dir
              dependency_dir="$(dirname "$requirements_file")"
              if [[ "$dependency_dir" == "." ]]; then
                dependency_dir=""
              fi

              local install_target="$repo_dir"
              if [[ -n "$dependency_dir" ]]; then
                install_target="$repo_dir/$dependency_dir"
              elif [[ "$workdir" != "." ]]; then
                install_target="$repo_dir/$workdir"
              fi

              "$venv_dir/bin/python" -m pip install "$install_target"
            fi
          elif [[ -n "${GENERATE_COMMAND:-}" ]]; then
            echo "::error::Python contract generation requested for $label, but no dependency installation plan was provided and no supported Python dependency file was found."
            exit 1
          else
            echo "No Python dependency installation required for $label."
          fi

          echo "${label^^}_PYTHON_VENV=$venv_dir" >> "$GITHUB_ENV"
        }

        install_node_dependencies() {
          local repo_dir="$1"
          local label="$2"
          local workdir="$WORKING_DIRECTORY"
          local package_dir="$repo_dir"

          if [[ "$workdir" != "." ]]; then
            package_dir="$repo_dir/$workdir"
          fi

          echo "Preparing Node.js runtime for $label: $package_dir"

          if [[ -n "$INSTALL_COMMAND" ]]; then
            run_in_working_directory "$repo_dir" "$INSTALL_COMMAND"
            return
          fi

          if [[ ! -f "$package_dir/package.json" ]]; then
            echo "::error::Node.js package.json not found in working directory for $label: $package_dir"
            exit 1
          fi

          case "${PACKAGE_MANAGER,,}" in
            pnpm)
              corepack enable
              if [[ -f "$package_dir/pnpm-lock.yaml" ]]; then
                (cd "$package_dir" && corepack pnpm install --frozen-lockfile)
              else
                (cd "$package_dir" && corepack pnpm install)
              fi
              ;;
            yarn)
              corepack enable
              if [[ -f "$package_dir/yarn.lock" ]]; then
                (cd "$package_dir" && corepack yarn install --frozen-lockfile)
              else
                (cd "$package_dir" && corepack yarn install)
              fi
              ;;
            npm|"")
              if [[ -f "$package_dir/package-lock.json" || -f "$package_dir/npm-shrinkwrap.json" ]]; then
                (cd "$package_dir" && npm ci --no-audit --no-fund)
              else
                (cd "$package_dir" && npm install --no-audit --no-fund)
              fi
              ;;
            *)
              echo "::error::Unsupported Node.js package manager '$PACKAGE_MANAGER'. Supply install-command from the adapter."
              exit 1
              ;;
          esac
        }

        install_java_dependencies() {
          local repo_dir="$1"
          local label="$2"
          local workdir="$WORKING_DIRECTORY"
          local project_dir="$repo_dir"

          if [[ "$workdir" != "." ]]; then
            project_dir="$repo_dir/$workdir"
          fi

          echo "Preparing Java runtime for $label: $project_dir"

          if [[ -n "$INSTALL_COMMAND" ]]; then
            run_in_working_directory "$repo_dir" "$INSTALL_COMMAND"
            return
          fi

          case "${PACKAGE_MANAGER,,}" in
            maven|"")
              if [[ -x "$project_dir/mvnw" ]]; then
                (cd "$project_dir" && ./mvnw -q -DskipTests dependency:go-offline)
              elif command -v mvn >/dev/null 2>&1 && [[ -f "$project_dir/pom.xml" ]]; then
                (cd "$project_dir" && mvn -q -DskipTests dependency:go-offline)
              else
                echo "::error::Java/Maven contract generation requires mvnw/pom.xml or an adapter install-command."
                exit 1
              fi
              ;;
            gradle)
              if [[ -x "$project_dir/gradlew" ]]; then
                (cd "$project_dir" && ./gradlew --no-daemon dependencies >/dev/null)
              elif command -v gradle >/dev/null 2>&1; then
                (cd "$project_dir" && gradle --no-daemon dependencies >/dev/null)
              else
                echo "::error::Java/Gradle contract generation requires gradlew or an adapter install-command."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported Java package manager '$PACKAGE_MANAGER'. Supply install-command from the adapter."
              exit 1
              ;;
          esac
        }

        install_dotnet_dependencies() {
          local repo_dir="$1"
          local label="$2"

          echo "Preparing .NET runtime for $label"

          if [[ -n "$INSTALL_COMMAND" ]]; then
            run_in_working_directory "$repo_dir" "$INSTALL_COMMAND"
          elif [[ "$WORKING_DIRECTORY" == "." ]]; then
            (cd "$repo_dir" && dotnet restore)
          else
            (cd "$repo_dir/$WORKING_DIRECTORY" && dotnet restore)
          fi
        }

        prepare_runtime() {
          local repo_dir="$1"
          local label="$2"

          if [[ -z "$GENERATE_COMMAND" ]]; then
            echo "Contract source is '$CONTRACT_SOURCE'; no generation command is required for $label."
            return 0
          fi

          local language="${LANGUAGE,,}"
          local package_manager="${PACKAGE_MANAGER,,}"

          case "$language" in
            python)
              install_python_dependencies "$repo_dir" "$label" "$WORKING_DIRECTORY"
              ;;
            node|node.js|"node.js / javascript"|javascript|typescript|javascript/typescript|typescript/javascript)
              install_node_dependencies "$repo_dir" "$label"
              ;;
            java)
              install_java_dependencies "$repo_dir" "$label"
              ;;
            c#|csharp|.net|dotnet|asp.net|"asp.net / .net")
              install_dotnet_dependencies "$repo_dir" "$label"
              ;;
            "")
              # Backwards-compatible inference for older generated workflows.
              if [[ -f "$repo_dir/manage.py" || "$GENERATE_COMMAND" == *"manage.py"* ]]; then
                LANGUAGE="Python"
                install_python_dependencies "$repo_dir" "$label" "$WORKING_DIRECTORY"
              elif [[ -f "$repo_dir/package.json" || "$GENERATE_COMMAND" == *"npm "* || "$GENERATE_COMMAND" == *"npx "* ]]; then
                LANGUAGE="Node.js"
                install_node_dependencies "$repo_dir" "$label"
              elif [[ -f "$repo_dir/pom.xml" || -f "$repo_dir/mvnw" || "$GENERATE_COMMAND" == *"mvn"* || "$GENERATE_COMMAND" == *"gradle"* ]]; then
                LANGUAGE="Java"
                install_java_dependencies "$repo_dir" "$label"
              elif [[ -n "$(find "$repo_dir" -maxdepth 2 \( -name '*.csproj' -o -name '*.sln' -o -name '*.slnx' \) -print -quit)" || "$GENERATE_COMMAND" == dotnet* || "$GENERATE_COMMAND" == *" dotnet "* ]]; then
                LANGUAGE="C#"
                install_dotnet_dependencies "$repo_dir" "$label"
              elif [[ -n "$INSTALL_COMMAND" ]]; then
                run_in_working_directory "$repo_dir" "$INSTALL_COMMAND"
              else
                echo "No repository-local runtime bootstrap required for $label."
              fi
              ;;
            *)
              if [[ -n "$INSTALL_COMMAND" ]]; then
                run_in_working_directory "$repo_dir" "$INSTALL_COMMAND"
              else
                echo "::error::Unsupported adapter language '$LANGUAGE'. Supply a valid language/package-manager/install-command plan."
                exit 1
              fi
              ;;
          esac
        }

        # Workdir is normalized once after Prepare CI variables.
        WORKING_DIRECTORY="$(normalize_plan_path "$WORKING_DIRECTORY")"

        if [[ "$WORKING_DIRECTORY" != "." && ! -d "$BASE_DIR/$WORKING_DIRECTORY" ]]; then
          echo "::error::Base working directory does not exist: $BASE_DIR/$WORKING_DIRECTORY"
          exit 1
        fi

        if [[ "$WORKING_DIRECTORY" != "." && ! -d "$HEAD_DIR/$WORKING_DIRECTORY" ]]; then
          echo "::error::Head working directory does not exist: $HEAD_DIR/$WORKING_DIRECTORY"
          exit 1
        fi

        while IFS= read -r dependency_file; do
          [[ -z "$dependency_file" ]] && continue
          dependency_file="${dependency_file#./}"
          if [[ "$dependency_file" = /* || "$dependency_file" == *".."* ]]; then
            echo "::error::Invalid adapter dependency file path: $dependency_file"
            exit 1
          fi
        done <<< "${DEPENDENCY_FILES:-}"

        prepare_runtime "$BASE_DIR" "base"
        prepare_runtime "$HEAD_DIR" "head"


    # ============================================================
    # 8. Generate / locate base specification (generation runs in adapter working-directory)
    # ============================================================

    - name: Generate or locate base specification
      if: ${{ steps.mode.outputs.skip != 'true' }}
      shell: bash
      env:
        GENERATE_COMMAND: ${{ inputs.generate-command }}
        SPEC_PATH: ${{ inputs.spec-path }}
      run: |
        set -euo pipefail

        if [[ -n "$GENERATE_COMMAND" ]]; then
          echo "Generating base OpenAPI specification..."
          echo "Working directory: $WORKING_DIRECTORY"
          echo "Generation command: $GENERATE_COMMAND"

          if [[ ! -d "$BASE_DIR/$WORKING_DIRECTORY" && "$WORKING_DIRECTORY" != "." ]]; then
            echo "::error::Base working directory does not exist: $BASE_DIR/$WORKING_DIRECTORY"
            exit 1
          fi

          if [[ -n "${BASE_PYTHON_VENV:-}" ]]; then
            source "$BASE_PYTHON_VENV/bin/activate"
          fi

          if [[ "$WORKING_DIRECTORY" == "." ]]; then
            (cd "$BASE_DIR" && eval "$GENERATE_COMMAND")
          else
            (cd "$BASE_DIR/$WORKING_DIRECTORY" && eval "$GENERATE_COMMAND")
          fi
        fi

        if [[ ! -f "$BASE_DIR/$SPEC_PATH" ]]; then
          echo "::error::Base specification not found: $BASE_DIR/$SPEC_PATH"
          echo "::error::Verify spec-path, working-directory, and the adapter generation plan."
          exit 1
        fi

        echo "BASE_SPEC_FILE=$BASE_DIR/$SPEC_PATH" >> "$GITHUB_ENV"


    # ============================================================
    # 9. Generate / locate head specification (generation runs in adapter working-directory)
    # ============================================================

    - name: Generate or locate head specification
      if: ${{ steps.mode.outputs.skip != 'true' }}
      shell: bash
      env:
        GENERATE_COMMAND: ${{ inputs.generate-command }}
        SPEC_PATH: ${{ inputs.spec-path }}
      run: |
        set -euo pipefail

        if [[ -n "$GENERATE_COMMAND" ]]; then
          echo "Generating head OpenAPI specification..."
          echo "Working directory: $WORKING_DIRECTORY"
          echo "Generation command: $GENERATE_COMMAND"

          if [[ ! -d "$HEAD_DIR/$WORKING_DIRECTORY" && "$WORKING_DIRECTORY" != "." ]]; then
            echo "::error::Head working directory does not exist: $HEAD_DIR/$WORKING_DIRECTORY"
            exit 1
          fi

          if [[ -n "${HEAD_PYTHON_VENV:-}" ]]; then
            source "$HEAD_PYTHON_VENV/bin/activate"
          fi

          if [[ "$WORKING_DIRECTORY" == "." ]]; then
            (cd "$HEAD_DIR" && eval "$GENERATE_COMMAND")
          else
            (cd "$HEAD_DIR/$WORKING_DIRECTORY" && eval "$GENERATE_COMMAND")
          fi
        fi

        if [[ ! -f "$HEAD_DIR/$SPEC_PATH" ]]; then
          echo "::error::Head specification not found: $HEAD_DIR/$SPEC_PATH"
          echo "::error::Verify spec-path, working-directory, and the adapter generation plan."
          exit 1
        fi

        echo "HEAD_SPEC_FILE=$HEAD_DIR/$SPEC_PATH" >> "$GITHUB_ENV"


    # ============================================================
    # 10. Normalize and validate OpenAPI specifications
    # ============================================================

    - name: Normalize and validate OpenAPI specifications
      if: ${{ steps.mode.outputs.skip != 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        normalize_spec() {
          local input_path="$1"
          local output_path="$2"

          if [[ ! -f "$input_path" ]]; then
            echo "::error::Specification not found: $input_path"
            exit 1
          fi

          case "${input_path##*.}" in
            json|JSON)
              jq empty "$input_path"
              jq -e 'type == "object" and (.openapi != null or .swagger != null)' "$input_path" >/dev/null || {
                echo "::error::Specification is not a valid OpenAPI/Swagger JSON object: $input_path"
                exit 1
              }
              jq '.' "$input_path" > "$output_path"
              ;;
            yaml|yml|YAML|YML)
              ruby -ryaml -rjson -e '
                input, output = ARGV
                data = YAML.safe_load_file(input, aliases: true)
                unless data.is_a?(Hash) && (data.key?("openapi") || data.key?("swagger"))
                  abort("Specification is not a valid OpenAPI/Swagger YAML object: #{input}")
                end
                File.write(output, JSON.generate(data))
              ' "$input_path" "$output_path"
              ;;
            *)
              echo "::error::Unsupported OpenAPI file extension for $input_path. Use .json, .yaml, or .yml."
              exit 1
              ;;
          esac

          python - "$output_path" <<'PY'
        import json
        import sys

        path = sys.argv[1]
        with open(path, "r", encoding="utf-8") as f:
            data = json.load(f)

        if not isinstance(data, dict):
            raise SystemExit(f"Normalized specification must be a JSON object: {path}")

        if not data.get("openapi") and not data.get("swagger"):
            raise SystemExit(f"Missing OpenAPI/Swagger version field: {path}")

        print(f"Validated OpenAPI contract: {path}")
        PY
        }

        BASE_SPEC_JSON="$RUNNER_TEMP/api-analyzer-base-spec.json"
        HEAD_SPEC_JSON="$RUNNER_TEMP/api-analyzer-head-spec.json"

        normalize_spec "$BASE_SPEC_FILE" "$BASE_SPEC_JSON"
        normalize_spec "$HEAD_SPEC_FILE" "$HEAD_SPEC_JSON"

        echo "BASE_SPEC_JSON=$BASE_SPEC_JSON" >> "$GITHUB_ENV"
        echo "HEAD_SPEC_JSON=$HEAD_SPEC_JSON" >> "$GITHUB_ENV"


    # ============================================================
    # 11. Build CI payload
    # ============================================================

    - name: Build CI payload
      if: ${{ steps.mode.outputs.skip != 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        python - "$BASE_SPEC_JSON" "$HEAD_SPEC_JSON" \
          > "$RUNNER_TEMP/api-analyzer-payload.json" <<'PY'
        import json
        import os
        import sys

        if len(sys.argv) != 3:
            raise SystemExit("Expected exactly two normalized specification paths.")

        base_path = sys.argv[1]
        head_path = sys.argv[2]

        with open(base_path, "r", encoding="utf-8") as f:
            base_spec = json.load(f)

        with open(head_path, "r", encoding="utf-8") as f:
            head_spec = json.load(f)

        dependency_files = [
            line.strip()
            for line in os.environ.get("DEPENDENCY_FILES", "").splitlines()
            if line.strip()
        ]
        generator_warnings = [
            line.strip()
            for line in os.environ.get("GENERATOR_WARNINGS", "").splitlines()
            if line.strip()
        ]

        runtime = {
            "language": os.environ.get("LANGUAGE", ""),
            "package_manager": os.environ.get("PACKAGE_MANAGER", ""),
            "dependency_files": dependency_files,
            "working_directory": os.environ.get("WORKING_DIRECTORY", "."),
            "install_command": os.environ.get("INSTALL_COMMAND", ""),
        }

        adapter = {
            "name": os.environ.get("ADAPTER_NAME", "customer-action"),
            "version": os.environ.get("ADAPTER_VERSION", "1"),
        }
        adapter["runtime"] = runtime

        source_type = os.environ.get("CONTRACT_SOURCE", "generated")

        payload = {
            "project_id": os.environ["PROJECT_ID"],
            "idempotency_key": (
                f"{os.environ['REPOSITORY']}:"
                f"{os.environ['PR_NUMBER']}:"
                f"{os.environ['HEAD_SHA']}:"
                f"{os.environ['COMPARE_BASE_SHA']}"
            ),
            "repository": os.environ["REPOSITORY"],
            "pull_request": int(os.environ["PR_NUMBER"]),
            "base_sha": os.environ["COMPARE_BASE_SHA"],
            "head_sha": os.environ["HEAD_SHA"],
            "base_spec": {
                "path": os.environ["SPEC_PATH"],
                "source_type": source_type,
                "content": base_spec,
            },
            "head_spec": {
                "path": os.environ["SPEC_PATH"],
                "source_type": source_type,
                "content": head_spec,
            },
            "registered_routes": [],
            "generator_warnings": generator_warnings,
            "adapter": adapter,
        }

        print(json.dumps(payload))
        PY


    # ============================================================
    # 12. Submit CI analysis
    # ============================================================

    - name: Submit CI analysis
      if: ${{ steps.mode.outputs.skip != 'true' }}
      id: submit
      shell: bash
      env:
        API_BASE_URL: ${{ inputs.api-base-url }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        RESPONSE_FILE="$RUNNER_TEMP/api-analyzer-submit.json"

        if [[ -z "$TOKEN" ]]; then
          echo "::error::API Analyzer token is empty."
          exit 1
        fi

        HTTP_CODE="$(
          curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 2 \
            --retry-connrefused \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/api-analyzer-payload.json" \
            "${API_BASE_URL%/}/api/ci/analyze"
        )"

        echo "HTTP status: $HTTP_CODE"

        if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "202" ]]; then
          echo "::error::API Analyzer submission failed with HTTP $HTTP_CODE"
          cat "$RESPONSE_FILE"
          exit 1
        fi

        COMPARISON_ID="$(jq -r '.comparison_id // empty' "$RESPONSE_FILE")"
        JOB_ID="$(jq -r '.job_id // empty' "$RESPONSE_FILE")"
        INITIAL_STATUS="$(jq -r '.status // empty' "$RESPONSE_FILE")"
        INITIAL_GATE_STATUS="$(jq -r '.gate_status // empty' "$RESPONSE_FILE")"
        INITIAL_REASON_CODE="$(jq -r '.reason_code // .execution_reason // empty' "$RESPONSE_FILE")"
        INITIAL_REPORT_URL="$(jq -r '.report_url // empty' "$RESPONSE_FILE")"

        if [[ -z "$COMPARISON_ID" ]]; then
          echo "::error::API Analyzer response did not contain comparison_id."
          cat "$RESPONSE_FILE"
          exit 1
        fi

        echo "COMPARISON_ID=$COMPARISON_ID" >> "$GITHUB_ENV"
        echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
        echo "GATE_STATUS=$INITIAL_GATE_STATUS" >> "$GITHUB_ENV"
        echo "REASON_CODE=$INITIAL_REASON_CODE" >> "$GITHUB_ENV"
        echo "REPORT_URL=$INITIAL_REPORT_URL" >> "$GITHUB_ENV"

        echo "comparison-id=$COMPARISON_ID" >> "$GITHUB_OUTPUT"
        echo "job-id=$JOB_ID" >> "$GITHUB_OUTPUT"
        echo "gate-status=$INITIAL_GATE_STATUS" >> "$GITHUB_OUTPUT"
        echo "reason-code=$INITIAL_REASON_CODE" >> "$GITHUB_OUTPUT"
        echo "report-url=$INITIAL_REPORT_URL" >> "$GITHUB_OUTPUT"

        case "$INITIAL_STATUS" in
          completed|failed|cancelled)
            echo "ANALYSIS_TERMINAL=true" >> "$GITHUB_ENV"
            echo "Analysis already reached terminal state: $INITIAL_STATUS"
            ;;

          queued|running|"")
            echo "ANALYSIS_TERMINAL=false" >> "$GITHUB_ENV"
            echo "Analysis is not terminal yet: ${INITIAL_STATUS:-unknown}"
            ;;

          *)
            echo "::error::Unknown analyzer status: $INITIAL_STATUS"
            cat "$RESPONSE_FILE"
            exit 1
            ;;
        esac


    # ============================================================
    # 13. Poll only if analysis is not already terminal
    # ============================================================

    - name: Poll analysis status
      if: ${{ steps.mode.outputs.skip != 'true' && env.ANALYSIS_TERMINAL != 'true' }}
      id: poll
      shell: bash
      env:
        API_BASE_URL: ${{ inputs.api-base-url }}
        TOKEN: ${{ inputs.token }}
        TIMEOUT_SECONDS: ${{ inputs.poll-timeout-seconds }}
        POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
      run: |
        set -euo pipefail

        START_TIME="$(date +%s)"

        while true; do
          RESPONSE_CODE="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              --retry 3 \
              --retry-delay 2 \
              --retry-connrefused \
              --output "$RUNNER_TEMP/api-analyzer-status.json" \
              --write-out "%{http_code}" \
              --request GET \
              --header "Authorization: Bearer $TOKEN" \
              "${API_BASE_URL%/}/api/ci/comparisons/${COMPARISON_ID}/status/"
          )"

          if [[ "$RESPONSE_CODE" != "200" ]]; then
            echo "::error::API Analyzer status request failed with HTTP $RESPONSE_CODE"
            cat "$RUNNER_TEMP/api-analyzer-status.json"
            exit 1
          fi

          RESPONSE="$(cat "$RUNNER_TEMP/api-analyzer-status.json")"

          STATUS="$(echo "$RESPONSE" | jq -r '.status // ""')"
          GATE_STATUS="$(echo "$RESPONSE" | jq -r '.gate_status // ""')"
          REASON_CODE="$(echo "$RESPONSE" | jq -r '.reason_code // .gate_reason_code // ""')"
          PROGRESS="$(echo "$RESPONSE" | jq -r '.progress // 0')"
          STAGE="$(echo "$RESPONSE" | jq -r '.stage // ""')"
          REPORT_URL="$(echo "$RESPONSE" | jq -r '.report_url // ""')"

          echo "status=$STATUS progress=$PROGRESS stage=$STAGE gate=$GATE_STATUS"

          if [[ "$STATUS" == "completed" || "$STATUS" == "failed" || "$STATUS" == "cancelled" ]]; then
            echo "GATE_STATUS=$GATE_STATUS" >> "$GITHUB_ENV"
            echo "REASON_CODE=$REASON_CODE" >> "$GITHUB_ENV"
            echo "REPORT_URL=$REPORT_URL" >> "$GITHUB_ENV"

            echo "gate-status=$GATE_STATUS" >> "$GITHUB_OUTPUT"
            echo "reason-code=$REASON_CODE" >> "$GITHUB_OUTPUT"
            echo "report-url=$REPORT_URL" >> "$GITHUB_OUTPUT"

            break
          fi

          NOW="$(date +%s)"
          ELAPSED="$((NOW - START_TIME))"

          if (( ELAPSED >= 10#$TIMEOUT_SECONDS )); then
            echo "::error::API Analyzer analysis timed out after ${TIMEOUT_SECONDS}s."
            exit 1
          fi

          sleep "$POLL_INTERVAL"
        done


    # ============================================================
    # 14. Evaluate CI gate
    # ============================================================

    - name: Evaluate CI gate
      if: ${{ steps.mode.outputs.skip != 'true' }}
      shell: bash
      env:
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -euo pipefail

        NORMALIZED_GATE="$(echo "${GATE_STATUS:-}" | tr '[:upper:]' '[:lower:]')"

        echo "Final gate: ${NORMALIZED_GATE:-empty}"
        echo "Reason: ${REASON_CODE:-none}"

        if [[ -n "${REPORT_URL:-}" ]]; then
          echo "Report: $REPORT_URL"
        fi

        case "$NORMALIZED_GATE" in
          pass)
            exit 0
            ;;

          warn)
            echo "::warning::API compatibility analysis returned WARN."
            exit 0
            ;;

          fail)
            echo "::error::API compatibility gate returned FAIL."
            exit 1
            ;;

          error|"")
            if [[ "${FAIL_ON_ERROR,,}" == "true" ]]; then
              echo "::error::API compatibility analysis could not complete."
              exit 1
            fi

            echo "::warning::Analyzer returned ERROR, but fail-on-error=false."
            exit 0
            ;;

          *)
            echo "::error::Unknown gate status: $GATE_STATUS"
            exit 1
            ;;
        esac


    # ============================================================
    # 15. Publish CI summary
    # ============================================================

    - name: Publish API Analyzer summary
      if: ${{ always() && steps.mode.outputs.skip != 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        {
          echo "## API Analyzer compatibility"
          echo
          echo "- Repository: \\`$REPOSITORY\\`"
          echo "- Pull request: #$PR_NUMBER"
          echo "- Contract: \\`$SPEC_PATH\\`"
          echo "- Contract source: \\`$CONTRACT_SOURCE\\`"
          echo "- Adapter: \\`$ADAPTER_NAME@$ADAPTER_VERSION\\`"
          echo "- Gate: \\`${GATE_STATUS:-unknown}\\`"
          echo "- Reason: \\`${REASON_CODE:-none}\\`"
          if [[ -n "${COMPARISON_ID:-}" ]]; then
            echo "- Comparison ID: \\`$COMPARISON_ID\\`"
          fi
          if [[ -n "${REPORT_URL:-}" ]]; then
            echo "- Report: $REPORT_URL"
          fi
        } >> "$GITHUB_STEP_SUMMARY"



    # ============================================================
    # 16. Cleanup worktrees
    # ============================================================

    - name: Cleanup worktrees
      if: always()
      shell: bash
      run: |
        set -euo pipefail

        BASE_DIR="${BASE_DIR:-}"
        HEAD_DIR="${HEAD_DIR:-}"

        if [[ -n "$BASE_DIR" && -d "$BASE_DIR" ]]; then
          git worktree remove "$BASE_DIR" --force 2>/dev/null || true
        fi

        if [[ -n "$HEAD_DIR" && -d "$HEAD_DIR" ]]; then
          git worktree remove "$HEAD_DIR" --force 2>/dev/null || true
        fi
